# Despliegue en el VPS con Coolify (también sirve localmente: docker compose up).
# Las variables reales se configuran en Coolify, nunca en el repositorio.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: packatelas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: packatelas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packatelas"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://packatelas:${POSTGRES_PASSWORD}@db:5432/packatelas
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://packatelas:${POSTGRES_PASSWORD}@db:5432/packatelas
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?define ENCRYPTION_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      UPLOAD_DIR: /data/uploads
      OSRM_URL: ${OSRM_URL:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    ports:
      - "3000"

volumes:
  pgdata:
  redisdata:
  uploads:
