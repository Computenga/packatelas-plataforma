# Despliegue en el VPS con Coolify (también sirve localmente: docker compose up).
# Las variables reales se configuran en Coolify, nunca en el repositorio.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: packatelas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: packatelas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packatelas"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://packatelas:${POSTGRES_PASSWORD}@db:5432/packatelas
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://packatelas:${POSTGRES_PASSWORD}@db:5432/packatelas
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?define ENCRYPTION_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      UPLOAD_DIR: /data/uploads
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    ports:
      - "3000"

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://packatelas:${POSTGRES_PASSWORD}@db:5432/packatelas
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?define ENCRYPTION_KEY}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Rutas con tiempos reales [A08, A26]: OSRM con el mapa de CDMX y Edomex (OpenStreetMap).
  # La primera vez descarga y procesa el mapa (~20-30 min); después solo arranca.
  osrm-map:
    image: alpine:3.20
    volumes:
      - osrm:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/zmvm.osm.pbf ]; then echo "Mapa descargado"; exit 0; fi
        apk add --no-cache osmium-tool >/dev/null
        wget -q -O /data/mexico.osm.pbf https://download.geofabrik.de/north-america/mexico-latest.osm.pbf
        osmium extract -b -99.75,18.85,-98.55,20.05 /data/mexico.osm.pbf -o /data/zmvm.tmp.pbf --overwrite
        rm /data/mexico.osm.pbf
        mv /data/zmvm.tmp.pbf /data/zmvm.osm.pbf
        echo "Mapa descargado"
    restart: "no"

  osrm-prep:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    volumes:
      - osrm:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/zmvm.osrm.mldgr ]; then echo "Mapa listo"; exit 0; fi
        until [ -f /data/zmvm.osm.pbf ]; do echo "Esperando la descarga…"; sleep 30; done
        osrm-extract -p /opt/car.lua /data/zmvm.osm.pbf
        osrm-partition /data/zmvm.osrm
        osrm-customize /data/zmvm.osrm
        echo "Mapa listo"
    restart: "no"

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    volumes:
      - osrm:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        until [ -f /data/zmvm.osrm.mldgr ]; do echo "Esperando el mapa…"; sleep 30; done
        exec osrm-routed --algorithm mld --max-table-size 500 /data/zmvm.osrm
    restart: unless-stopped

volumes:
  osrm:
  pgdata:
  redisdata:
  uploads:
