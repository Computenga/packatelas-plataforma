# Despliegue en el VPS con Coolify (también sirve localmente: docker compose up).
# Las variables reales se configuran en Coolify, nunca en el repositorio.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: packatelas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: packatelas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packatelas"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://packatelas:${POSTGRES_PASSWORD}@db:5432/packatelas
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://packatelas:${POSTGRES_PASSWORD}@db:5432/packatelas
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?define ENCRYPTION_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      UPLOAD_DIR: /data/uploads
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      FACTURACOM_API_KEY: ${FACTURACOM_API_KEY:-}
      FACTURACOM_SECRET_KEY: ${FACTURACOM_SECRET_KEY:-}
      FACTURACOM_ENTORNO: ${FACTURACOM_ENTORNO:-pruebas}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
      BACKUP_DIR: /backups
    volumes:
      - uploads:/data/uploads
      - backups:/backups:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    ports:
      - "3000"

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://packatelas:${POSTGRES_PASSWORD}@db:5432/packatelas
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?define ENCRYPTION_KEY}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      FACTURACOM_API_KEY: ${FACTURACOM_API_KEY:-}
      FACTURACOM_SECRET_KEY: ${FACTURACOM_SECRET_KEY:-}
      FACTURACOM_ENTORNO: ${FACTURACOM_ENTORNO:-pruebas}
      DRIVE_REFRESH_TOKEN: ${DRIVE_REFRESH_TOKEN:-}
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      BACKUP_DIR: /backups
      UPLOAD_DIR: /data/uploads
    volumes:
      - backups:/backups:ro
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Respaldos [P08]: copia diaria de la base (formato pg_dump) en el volumen "backups".
  # El worker la sube a Google Drive si hay DRIVE_REFRESH_TOKEN; el admin la descarga desde Salud.
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/packatelas-$$(date -u +%Y-%m-%d).dump
          hay=$$(ls /backups/*.dump 2>/dev/null | head -1)
          # 09:00 UTC = 03:00 CDMX; el primer respaldo se hace al arrancar.
          if [ ! -f "$$f" ] && { [ "$$(date -u +%H)" -ge 9 ] || [ -z "$$hay" ]; }; then
            if pg_dump -h db -U packatelas -Fc packatelas > "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "Respaldo listo: $$f"; else rm -f "$$f.tmp"; echo "Falló el respaldo"; fi
          fi
          find /backups -name '*.dump' -mtime +$$KEEP_DAYS -delete
          sleep 900
        done
    depends_on:
      db: { condition: service_healthy }

  # Rutas con tiempos reales [A08, A26]: OSRM con el mapa de CDMX y Edomex (OpenStreetMap).
  # La primera vez descarga y procesa el mapa (~20-30 min); después solo arranca.
  osrm-map:
    image: debian:bookworm-slim
    volumes:
      - osrm:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/zmvm.osm.pbf ]; then echo "Mapa descargado"; exit 0; fi
        apt-get update -qq && apt-get install -y -qq --no-install-recommends osmium-tool wget ca-certificates >/dev/null
        echo "Descargando mapa de México…"
        wget -q -O /data/mexico.osm.pbf https://download.geofabrik.de/north-america/mexico-latest.osm.pbf
        osmium extract -b -99.75,18.85,-98.55,20.05 /data/mexico.osm.pbf -o /data/zmvm.tmp.pbf --overwrite
        rm /data/mexico.osm.pbf
        mv /data/zmvm.tmp.pbf /data/zmvm.osm.pbf
        echo "Mapa descargado"
    restart: "no"

  osrm-prep:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    volumes:
      - osrm:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/zmvm.osrm.mldgr ]; then echo "Mapa listo"; exit 0; fi
        until [ -f /data/zmvm.osm.pbf ]; do echo "Esperando la descarga…"; sleep 30; done
        osrm-extract -p /opt/car.lua /data/zmvm.osm.pbf
        osrm-partition /data/zmvm.osrm
        osrm-customize /data/zmvm.osrm
        echo "Mapa listo"
    restart: "no"

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    volumes:
      - osrm:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        until [ -f /data/zmvm.osrm.mldgr ]; do echo "Esperando el mapa…"; sleep 30; done
        exec osrm-routed --algorithm mld --max-table-size 500 /data/zmvm.osrm
    restart: unless-stopped

volumes:
  backups:
  osrm:
  pgdata:
  redisdata:
  uploads:
